<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 140" width="900" height="140">
  <defs>
    <!-- Background gradient - light steel blue like original -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C8DCF0;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#B8CDE4;stop-opacity:1"/>
    </linearGradient>

    <!-- Shield gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D2B6B"/>
      <stop offset="100%" style="stop-color:#1547C0"/>
    </linearGradient>

    <!-- Gold gradient for accents -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C8960C"/>
      <stop offset="50%" style="stop-color:#F5C842"/>
      <stop offset="100%" style="stop-color:#C8960C"/>
    </linearGradient>

    <!-- Circuit pattern for AI/ML feel -->
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1547C0"/>
      <stop offset="100%" style="stop-color:#0891B2"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Shadow filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="rgba(13,43,107,0.25)"/>
    </filter>

    <filter id="textShadow">
      <feDropShadow dx="1" dy="1" stdDeviation="1.5" flood-color="rgba(0,0,0,0.15)"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="140" fill="url(#bgGrad)" rx="0"/>

  <!-- Subtle grid texture overlay -->
  <rect width="900" height="140" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="0"/>

  <!-- ═══════════════════════════════════════ -->
  <!-- LEFT SIDE: SHIELD EMBLEM               -->
  <!-- ═══════════════════════════════════════ -->

  <!-- Outer ring / halo -->
  <circle cx="70" cy="70" r="58" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.7"/>
  <circle cx="70" cy="70" r="54" fill="rgba(13,43,107,0.08)" stroke="rgba(13,43,107,0.2)" stroke-width="1"/>

  <!-- Shield body -->
  <path d="M70 18 L106 32 L106 72 Q106 98 70 116 Q34 98 34 72 L34 32 Z"
        fill="url(#shieldGrad)" filter="url(#shadow)"/>

  <!-- Shield inner border -->
  <path d="M70 24 L100 36 L100 72 Q100 94 70 110 Q40 94 40 72 L40 36 Z"
        fill="none" stroke="url(#goldGrad)" stroke-width="1.8" opacity="0.8"/>

  <!-- Shield decorative top band -->
  <path d="M70 24 L100 36 L40 36 Z" fill="rgba(245,200,66,0.25)"/>

  <!-- Central AI Brain / Circuit Icon -->
  <!-- Brain outline shape -->
  <g transform="translate(70,65)">
    <!-- Neural network nodes -->
    <circle cx="-16" cy="-8"  r="5" fill="#F5C842" opacity="0.9"/>
    <circle cx="0"   cy="-18" r="5" fill="#F5C842" opacity="0.9"/>
    <circle cx="16"  cy="-8"  r="5" fill="#F5C842" opacity="0.9"/>
    <circle cx="-16" cy="8"   r="5" fill="#7DD3FC" opacity="0.9"/>
    <circle cx="0"   cy="18"  r="5" fill="#7DD3FC" opacity="0.9"/>
    <circle cx="16"  cy="8"   r="5" fill="#7DD3FC" opacity="0.9"/>
    <!-- Center node -->
    <circle cx="0" cy="0" r="6" fill="white" opacity="0.95"/>
    <circle cx="0" cy="0" r="3" fill="#F5C842"/>

    <!-- Neural connections -->
    <line x1="-16" y1="-8"  x2="0"   y2="0"   stroke="rgba(255,255,255,0.6)" stroke-width="1.2"/>
    <line x1="0"   y1="-18" x2="0"   y2="0"   stroke="rgba(255,255,255,0.6)" stroke-width="1.2"/>
    <line x1="16"  y1="-8"  x2="0"   y2="0"   stroke="rgba(255,255,255,0.6)" stroke-width="1.2"/>
    <line x1="-16" y1="8"   x2="0"   y2="0"   stroke="rgba(255,255,255,0.6)" stroke-width="1.2"/>
    <line x1="0"   y1="18"  x2="0"   y2="0"   stroke="rgba(255,255,255,0.6)" stroke-width="1.2"/>
    <line x1="16"  y1="8"   x2="0"   y2="0"   stroke="rgba(255,255,255,0.6)" stroke-width="1.2"/>
    <!-- Cross connections -->
    <line x1="-16" y1="-8"  x2="0"   y2="-18" stroke="rgba(255,255,255,0.35)" stroke-width="0.8"/>
    <line x1="0"   y1="-18" x2="16"  y2="-8"  stroke="rgba(255,255,255,0.35)" stroke-width="0.8"/>
    <line x1="-16" y1="8"   x2="0"   y2="18"  stroke="rgba(255,255,255,0.35)" stroke-width="0.8"/>
    <line x1="0"   y1="18"  x2="16"  y2="8"   stroke="rgba(255,255,255,0.35)" stroke-width="0.8"/>
    <line x1="-16" y1="-8"  x2="-16" y2="8"   stroke="rgba(255,255,255,0.35)" stroke-width="0.8"/>
    <line x1="16"  y1="-8"  x2="16"  y2="8"   stroke="rgba(255,255,255,0.35)" stroke-width="0.8"/>
  </g>

  <!-- Shield bottom label -->
  <text x="70" y="107" text-anchor="middle" font-family="Georgia, serif" font-size="6.5"
        font-weight="700" fill="url(#goldGrad)" letter-spacing="1">ESTD. 1997</text>

  <!-- ═══════════════════════════════════════ -->
  <!-- VERTICAL DIVIDER                        -->
  <!-- ═══════════════════════════════════════ -->
  <line x1="148" y1="18" x2="148" y2="122" stroke="url(#goldGrad)" stroke-width="2" opacity="0.7"/>

  <!-- ═══════════════════════════════════════ -->
  <!-- MIDDLE: COLLEGE NAME                    -->
  <!-- ═══════════════════════════════════════ -->

  <!-- PVPSIT large text -->
  <text x="172" y="62" font-family="Georgia, 'Times New Roman', serif"
        font-size="42" font-weight="700" fill="#0D2B6B"
        filter="url(#textShadow)" letter-spacing="2">PVPSIT</text>

  <!-- Underline accent bar -->
  <rect x="172" y="68" width="210" height="3" rx="1.5" fill="url(#goldGrad)"/>

  <!-- Full college name -->
  <text x="172" y="86" font-family="'Trebuchet MS', Arial, sans-serif"
        font-size="9.5" font-weight="600" fill="#1547C0" letter-spacing="1.2">
    PRASAD V. POTLURI SIDDHARTHA INSTITUTE OF TECHNOLOGY
  </text>

  <!-- Location -->
  <text x="172" y="100" font-family="'Trebuchet MS', Arial, sans-serif"
        font-size="8.5" font-weight="500" fill="#3B5EA6" letter-spacing="0.8">
    KANURU, VIJAYAWADA – 520007, ANDHRA PRADESH
  </text>

  <!-- Affiliation -->
  <text x="172" y="114" font-family="'Trebuchet MS', Arial, sans-serif"
        font-size="8" font-weight="400" fill="#4A6FA5" letter-spacing="0.6"
        font-style="italic">
    Affiliated to JNTU Kakinada | NAAC A+ Accredited
  </text>

  <!-- ═══════════════════════════════════════ -->
  <!-- RIGHT DIVIDER                           -->
  <!-- ═══════════════════════════════════════ -->
  <line x1="442" y1="18" x2="442" y2="122" stroke="url(#goldGrad)" stroke-width="2" opacity="0.7"/>

  <!-- ═══════════════════════════════════════ -->
  <!-- RIGHT: DEPARTMENT NAME                  -->
  <!-- ═══════════════════════════════════════ -->

  <!-- DEPARTMENT OF label -->
  <text x="462" y="38" font-family="'Trebuchet MS', Arial, sans-serif"
        font-size="11" font-weight="600" fill="#1547C0" letter-spacing="3">
    DEPARTMENT OF
  </text>

  <!-- CSE line -->
  <text x="462" y="60" font-family="Georgia, 'Times New Roman', serif"
        font-size="18" font-weight="700" fill="#0D2B6B" letter-spacing="1.5">
    COMPUTER SCIENCE &amp; ENGINEERING
  </text>

  <!-- AI ML highlighted line with background pill -->
  <rect x="459" y="68" width="418" height="36" rx="6"
        fill="url(#shieldGrad)" opacity="0.92" filter="url(#shadow)"/>

  <!-- Circuit dots decoration inside pill -->
  <circle cx="476" cy="86" r="3" fill="rgba(245,200,66,0.6)"/>
  <circle cx="489" cy="78" r="2" fill="rgba(245,200,66,0.4)"/>
  <circle cx="866" cy="86" r="3" fill="rgba(125,211,252,0.6)"/>
  <circle cx="854" cy="78" r="2" fill="rgba(125,211,252,0.4)"/>
  <!-- Small circuit lines -->
  <line x1="476" y1="86" x2="489" y2="78" stroke="rgba(245,200,66,0.3)" stroke-width="1"/>
  <line x1="854" y1="78" x2="866" y2="86" stroke="rgba(125,211,252,0.3)" stroke-width="1"/>

  <!-- AI & ML text inside pill -->
  <text x="670" y="91" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="17" font-weight="700" fill="#FFFFFF" letter-spacing="2">
    (ARTIFICIAL INTELLIGENCE &amp; MACHINE LEARNING)
  </text>

  <!-- Small AI icon inside pill - left side -->
  <g transform="translate(500, 86)">
    <circle cx="-8"  cy="-5" r="2.5" fill="#F5C842" opacity="0.8"/>
    <circle cx="0"   cy="-9" r="2.5" fill="#F5C842" opacity="0.8"/>
    <circle cx="8"   cy="-5" r="2.5" fill="#7DD3FC" opacity="0.8"/>
    <circle cx="-8"  cy="3"  r="2.5" fill="#7DD3FC" opacity="0.8"/>
    <circle cx="0"   cy="7"  r="2.5" fill="#F5C842" opacity="0.8"/>
    <circle cx="8"   cy="3"  r="2.5" fill="#F5C842" opacity="0.8"/>
    <circle cx="0"   cy="-1" r="3"   fill="white"   opacity="0.9"/>
    <line x1="-8" y1="-5" x2="0" y2="-1" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
    <line x1="0"  y1="-9" x2="0" y2="-1" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
    <line x1="8"  y1="-5" x2="0" y2="-1" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
    <line x1="-8" y1="3"  x2="0" y2="-1" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
    <line x1="0"  y1="7"  x2="0" y2="-1" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
    <line x1="8"  y1="3"  x2="0" y2="-1" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
  </g>

  <!-- Vision text below pill -->
  <text x="670" y="120" text-anchor="middle"
        font-family="'Trebuchet MS', Arial, sans-serif"
        font-size="9" font-weight="500" fill="#2D4A8A" letter-spacing="1.5"
        font-style="italic">
    Innovate · Integrate · Inspire
  </text>

  <!-- ═══════════════════════════════════════ -->
  <!-- TOP & BOTTOM BORDER LINES               -->
  <!-- ═══════════════════════════════════════ -->
  <rect x="0" y="0"   width="900" height="5" fill="url(#shieldGrad)"/>
  <rect x="0" y="135" width="900" height="5" fill="url(#shieldGrad)"/>

  <!-- Gold accent line just inside top border -->
  <rect x="0" y="5"   width="900" height="2" fill="url(#goldGrad)" opacity="0.6"/>
  <rect x="0" y="133" width="900" height="2" fill="url(#goldGrad)" opacity="0.6"/>

</svg>
